<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Unblocked DuckDuckGo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .search-container {
            text-align: center;
            background: #333;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #222;
            color: #fff;
            outline: none;
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background: #de5833;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background: #c84925;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h2>DuckDuckGo Lite</h2>
    <!-- This targets DuckDuckGo's official HTML/no-JS endpoint -->
    <form action="https://html.duckduckgo.com/html/" method="get">
        <input type="text" name="q" placeholder="Search privately..." required autocomplete="off">
        <br>
        <input type="submit" value="Search">
    </form>
</div>

</body>
</html>
